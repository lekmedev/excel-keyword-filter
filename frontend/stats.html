<!doctype html>
<html lang="vi" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê sử dụng — Excel Keyword Filter</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  body { background: #0f1117; color: #e6e8ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .glass { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; backdrop-filter: blur(8px); }
  .stat-num { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .stat-label { color: #8b90a0; font-size: .85rem; }
  .accent { color: #5eead4; }
  .accent2 { color: #a78bfa; }
  .table { --bs-table-bg: transparent; color: #cfd3de; }
  .table thead th { color: #8b90a0; font-weight: 600; border-bottom-color: rgba(255,255,255,.1); }
  .chip { display:inline-block; padding: .18rem .6rem; margin: .12rem; border-radius: 999px; background: rgba(94,234,212,.12); color: #5eead4; font-size: .8rem; }
  .status-ok { color: #4ade80; } .status-err { color: #f87171; }
  .muted { color: #6b7280; }
</style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h1 class="h3 mb-0">📊 Thống kê sử dụng</h1>
      <div class="muted small">Excel Keyword Filter — log giữ 90 ngày, tự xóa</div>
    </div>
    <div class="muted small" id="updatedAt"></div>
  </div>

  <!-- 4 cards tổng quan -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="glass p-3 h-100">
        <div class="stat-num accent" id="statTotal">–</div>
        <div class="stat-label">Tổng requests</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="glass p-3 h-100">
        <div class="stat-num accent2" id="statToday">–</div>
        <div class="stat-label">Hôm nay</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="glass p-3 h-100">
        <div class="stat-num" style="color:#fbbf24" id="statUploads">–</div>
        <div class="stat-label">Số lần upload</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="glass p-3 h-100">
        <div class="stat-num" style="color:#f472b6" id="statKeywords">–</div>
        <div class="stat-label">Từ khóa đã dùng</div>
      </div>
    </div>
  </div>

  <!-- Biểu đồ -->
  <div class="row g-3 mb-4">
    <div class="col-lg-6">
      <div class="glass p-3 h-100">
        <div class="mb-2 fw-semibold small text-uppercase muted">Request theo giờ</div>
        <canvas id="chartHour" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="glass p-3 h-100">
        <div class="mb-2 fw-semibold small text-uppercase muted">Request theo ngày</div>
        <canvas id="chartDay" height="220"></canvas>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <!-- Keywords phổ biến -->
    <div class="col-lg-6">
      <div class="glass p-3 h-100">
        <div class="mb-2 fw-semibold small text-uppercase muted">🔑 Từ khóa filter phổ biến</div>
        <div id="kwList" class="mb-2"><span class="muted small">Đang tải…</span></div>
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>#</th><th>Từ khóa</th><th class="text-end">Lượt</th></tr></thead>
          <tbody id="kwTable"></tbody>
        </table>
      </div>
    </div>
    <!-- Top IP -->
    <div class="col-lg-6">
      <div class="glass p-3 h-100">
        <div class="mb-2 fw-semibold small text-uppercase muted">🌐 Top IP</div>
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>#</th><th>IP</th><th class="text-end">Lượt</th></tr></thead>
          <tbody id="ipTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Hoạt động gần đây -->
  <div class="glass p-3 mt-4">
    <div class="mb-2 fw-semibold small text-uppercase muted">🕒 Hoạt động gần đây</div>
    <div class="table-responsive">
      <table class="table table-sm align-middle mb-0">
        <thead><tr><th>Thời gian</th><th>IP</th><th>Trang</th><th>Status</th><th>Từ khóa</th></tr></thead>
        <tbody id="recentTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
async function load() {
  try {
    const res = await fetch('/stats/data');
    const d = await res.json();
    document.getElementById('statTotal').textContent = d.total ?? 0;
    document.getElementById('statToday').textContent = d.today ?? 0;
    document.getElementById('statUploads').textContent = d.uploads ?? 0;
    document.getElementById('statKeywords').textContent = d.keyword_count ?? 0;
    document.getElementById('updatedAt').textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN');

    // Charts
    const hours = d.by_hour || {};
    const labelsH = Object.keys(hours);
    const valsH = labelsH.map(h => hours[h]);
    renderChart('chartHour', 'bar', labelsH, valsH, '#5eead4');

    const days = d.by_day || {};
    const labelsD = Object.keys(days);
    const valsD = labelsD.map(x => days[x]);
    renderChart('chartDay', 'line', labelsD, valsD, '#a78bfa');

    // Keywords
    const kws = d.top_keywords || [];
    document.getElementById('kwList').innerHTML = kws.slice(0,8).map(k =>
      `<span class="chip">${esc(k.keyword)} <b>${k.count}</b></span>`).join('') || '<span class="muted small">Chưa có dữ liệu</span>';
    document.getElementById('kwTable').innerHTML = kws.length
      ? kws.map((k,i) => `<tr><td class="muted">${i+1}</td><td>${esc(k.keyword)}</td><td class="text-end">${k.count}</td></tr>`).join('')
      : '<tr><td colspan="3" class="text-center muted small">Chưa có dữ liệu</td></tr>';

    // Top IP
    const ips = d.top_ips || [];
    document.getElementById('ipTable').innerHTML = ips.length
      ? ips.map((x,i) => `<tr><td class="muted">${i+1}</td><td>${esc(x.ip)}</td><td class="text-end">${x.count}</td></tr>`).join('')
      : '<tr><td colspan="3" class="text-center muted small">Chưa có dữ liệu</td></tr>';

    // Recent
    const rec = d.recent || [];
    document.getElementById('recentTable').innerHTML = rec.length
      ? rec.slice().reverse().map(r => {
          const st = r.status === 200 ? '<span class="status-ok">200</span>' : `<span class="status-err">${esc(String(r.status))}</span>`;
          const kw = r.keywords ? `<span class="chip">${esc(String(r.keywords).replace(/\n/g, ', '))}</span>` : '<span class="muted">—</span>';
          return `<tr><td class="muted small">${esc(r.ts || '')}</td><td class="small">${esc(r.ip || '')}</td><td><span class="badge text-bg-secondary">${esc(r.path || '')}</span></td><td>${st}</td><td>${kw}</td></tr>`;
        }).join('')
      : '<tr><td colspan="5" class="text-center muted small">Chưa có dữ liệu</td></tr>';
  } catch (e) {
    console.error(e);
    document.getElementById('kwList').innerHTML = '<span class="status-err">Lỗi tải dữ liệu</span>';
  }
}

function renderChart(id, type, labels, values, color) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  new Chart(ctx, {
    type,
    data: { labels, datasets: [{ data: values, backgroundColor: color + '55', borderColor: color, borderWidth: type === 'line' ? 2 : 0, fill: type === 'line' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#8b90a0', maxRotation: 0 }, grid: { color: 'rgba(255,255,255,.05)' } },
               y: { beginAtZero: true, ticks: { color: '#8b90a0', precision: 0 }, grid: { color: 'rgba(255,255,255,.05)' } } }
    }
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

load();
</script>
</body>
</html>
